name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: GitHub Pages için Yapılandır
        uses: actions/configure-pages@v5

      - name: Statik Web Dosyalarını Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages Canlıya Al
        id: deployment
        uses: actions/deploy-pages@v4
